name: Backend CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # BACKEND CI
  # ============================================================
  test:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ========================================================
      # VALIDATE OPENAPI
      # ========================================================
      - name: Validate OpenAPI 3.1 contract
        run: |
          docker compose \
            --project-name larissama-openapi-ci \
            -f compose.openapi.yaml \
            run --build --rm openapi-validator

      # ========================================================
      # MATCH CONTAINER USER
      # ========================================================
      - name: Match container user to workspace owner
        run: |
          printf 'LARISSAMA_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'LARISSAMA_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"

      # ========================================================
      # TEST BACKEND
      # ========================================================
      - name: Run Pint and full suite on disposable MySQL 8.0.40
        run: |
          docker compose \
            --project-name larissama-backend-ci \
            -f compose.test.yaml \
            run --build --rm test-runner \
            sh -lc 'composer install --no-interaction --prefer-dist --no-progress && vendor/bin/pint --test && php artisan test --no-progress'

      # ========================================================
      # CLEANUP CI
      # ========================================================
      - name: Clean up disposable Compose projects
        if: always()
        run: |
          docker compose \
            --project-name larissama-backend-ci \
            -f compose.test.yaml \
            down --remove-orphans

          docker compose \
            --project-name larissama-openapi-ci \
            -f compose.openapi.yaml \
            down --remove-orphans

  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy:
    name: Deploy Production

    # Deploy hanya berjalan jika Backend CI berhasil
    needs: test

    # Production hanya deploy ketika push ke branch main
    # Pull Request hanya menjalankan Backend CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 15

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout production source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ========================================================
      # CHECK PRODUCTION SERVER
      # ========================================================
      - name: Check production environment
        run: |
          echo "========================================"
          echo "PHP"
          echo "========================================"
          php -v

          echo ""
          echo "========================================"
          echo "COMPOSER"
          echo "========================================"
          composer --version

          echo ""
          echo "========================================"
          echo "RSYNC"
          echo "========================================"
          rsync --version | head -n 1

          echo ""
          echo "========================================"
          echo "DEPLOY USER"
          echo "========================================"
          whoami
          groups

      # ========================================================
      # INSTALL COMPOSER DEPENDENCIES
      # ========================================================
      - name: Install production Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # ========================================================
      # RSYNC DEPLOY
      # ========================================================
      - name: Deploy source to production
        run: |
          rsync -rlDv --delete \
            --no-perms \
            --no-owner \
            --no-group \
            --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.user.ini' \
            --exclude='.well-known/' \
            --exclude='storage/' \
            ./ /www/wwwroot/apilarissama.udumbara.my.id/

      # ========================================================
      # PREPARE LARAVEL DIRECTORIES
      # ========================================================
      - name: Prepare Laravel writable directories
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "CREATE LARAVEL DIRECTORIES"
          echo "========================================"

          mkdir -p storage/app
          mkdir -p storage/app/public
          mkdir -p storage/framework
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          echo ""
          echo "========================================"
          echo "SET OWNERSHIP"
          echo "========================================"

          sudo chown -R www:www storage
          sudo chown -R www:www bootstrap/cache

          echo ""
          echo "========================================"
          echo "SET DIRECTORY PERMISSIONS"
          echo "========================================"

          sudo find storage \
            -type d \
            -exec chmod 775 {} \;

          sudo find bootstrap/cache \
            -type d \
            -exec chmod 775 {} \;

          echo ""
          echo "========================================"
          echo "SET FILE PERMISSIONS"
          echo "========================================"

          sudo find storage \
            -type f \
            -exec chmod 664 {} \;

          sudo find bootstrap/cache \
            -type f \
            -exec chmod 664 {} \;

      # ========================================================
      # VERIFY WRITABLE DIRECTORIES
      # ========================================================
      - name: Verify Laravel permissions
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "STORAGE"
          echo "========================================"

          ls -ld storage
          ls -ld storage/logs
          ls -ld storage/framework
          ls -ld storage/framework/cache
          ls -ld storage/framework/sessions
          ls -ld storage/framework/views

          echo ""
          echo "========================================"
          echo "BOOTSTRAP CACHE"
          echo "========================================"

          ls -ld bootstrap/cache

      # ========================================================
      # CLEAR OLD LARAVEL CACHE
      # ========================================================
      - name: Clear old Laravel cache
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "CLEAR OLD CACHE"
          echo "========================================"

          php artisan optimize:clear

      # ========================================================
      # DATABASE MIGRATION
      # ========================================================
      - name: Run database migrations
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "DATABASE MIGRATION"
          echo "========================================"

          php artisan migrate --force

      # ========================================================
      # BUILD PRODUCTION CACHE
      # ========================================================
      - name: Build Laravel production cache
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "CONFIG CACHE"
          echo "========================================"

          php artisan config:cache

          echo ""
          echo "========================================"
          echo "ROUTE CACHE"
          echo "========================================"

          php artisan route:cache

      # ========================================================
      # RESTORE WRITABLE PERMISSIONS
      # ========================================================
      - name: Restore Laravel writable permissions
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "RESTORE OWNERSHIP"
          echo "========================================"

          sudo chown -R www:www storage
          sudo chown -R www:www bootstrap/cache

          sudo find storage \
            -type d \
            -exec chmod 775 {} \;

          sudo find storage \
            -type f \
            -exec chmod 664 {} \;

          sudo find bootstrap/cache \
            -type d \
            -exec chmod 775 {} \;

          sudo find bootstrap/cache \
            -type f \
            -exec chmod 664 {} \;

      # ========================================================
      # VERIFY LARAVEL
      # ========================================================
      - name: Verify Laravel production
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "LARAVEL PRODUCTION STATUS"
          echo "========================================"

          php artisan about

          echo ""
          echo "========================================"
          echo "FINAL PERMISSIONS"
          echo "========================================"

          ls -ld storage
          ls -ld storage/logs
          ls -ld bootstrap/cache

      # ========================================================
      # HTTP HEALTH CHECK
      # ========================================================
      - name: Verify production HTTP response
        run: |
          echo "========================================"
          echo "PRODUCTION HTTP CHECK"
          echo "========================================"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --output /dev/null \
            --write-out "%{http_code}" \
            https://apilarissama.udumbara.my.id/)

          echo "HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 400 ]; then
            echo "Production health check failed."
            exit 1
          fi

          echo "Production health check successful."
