name: Backend CI & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # BACKEND CI
  # ============================================================
  test:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate OpenAPI 3.1 contract
        run: |
          docker compose \
            --project-name larissama-openapi-ci \
            -f compose.openapi.yaml \
            run --build --rm openapi-validator

      - name: Match container user to workspace owner
        run: |
          printf 'LARISSAMA_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'LARISSAMA_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"

      - name: Run Pint and full suite on disposable MySQL 8.0.40
        run: |
          docker compose \
            --project-name larissama-backend-ci \
            -f compose.test.yaml \
            run --build --rm test-runner \
            sh -lc 'composer install --no-interaction --prefer-dist --no-progress && vendor/bin/pint --test && php artisan test --no-progress'

      - name: Clean up disposable Compose projects
        if: always()
        run: |
          docker compose \
            --project-name larissama-backend-ci \
            -f compose.test.yaml \
            down --remove-orphans

          docker compose \
            --project-name larissama-openapi-ci \
            -f compose.openapi.yaml \
            down --remove-orphans

  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy:
    name: Deploy Production

    # Deploy menunggu Backend CI berhasil
    needs: test

    # Production hanya deploy ketika push ke branch main.
    # Pull Request hanya menjalankan Backend CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 15

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout production source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ========================================================
      # CHECK SERVER
      # ========================================================
      - name: Check production environment
        run: |
          echo "========================================"
          echo "PHP"
          echo "========================================"
          php -v

          echo ""
          echo "========================================"
          echo "COMPOSER"
          echo "========================================"
          composer --version

          echo ""
          echo "========================================"
          echo "RSYNC"
          echo "========================================"
          rsync --version | head -n 1

          echo ""
          echo "========================================"
          echo "DEPLOY USER"
          echo "========================================"
          whoami
          groups

      # ========================================================
      # COMPOSER
      # ========================================================
      - name: Install production Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # ========================================================
      # RSYNC DEPLOY
      # ========================================================
      - name: Deploy source to production
        run: |
          rsync -rlDv --delete \
            --no-perms \
            --no-owner \
            --no-group \
            --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.user.ini' \
            --exclude='.well-known/' \
            --exclude='storage/' \
            ./ /www/wwwroot/apilarissama.udumbara.my.id/

      # ========================================================
      # PREPARE LARAVEL DIRECTORIES
      # ========================================================
      - name: Prepare Laravel writable directories
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          chmod -R 775 storage
          chmod -R 775 bootstrap/cache

      # ========================================================
      # LARAVEL PRODUCTION
      # ========================================================
      - name: Run Laravel production commands
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "CLEAR OLD CACHE"
          echo "========================================"
          php artisan optimize:clear

          echo ""
          echo "========================================"
          echo "DATABASE MIGRATION"
          echo "========================================"
          php artisan migrate --force

          echo ""
          echo "========================================"
          echo "CONFIG CACHE"
          echo "========================================"
          php artisan config:cache

          echo ""
          echo "========================================"
          echo "ROUTE CACHE"
          echo "========================================"
          php artisan route:cache

      # ========================================================
      # VERIFY
      # ========================================================
      - name: Verify Laravel production
        run: |
          cd /www/wwwroot/apilarissama.udumbara.my.id

          echo "========================================"
          echo "LARAVEL PRODUCTION STATUS"
          echo "========================================"

          php artisan about
