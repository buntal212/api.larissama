name: larissama-backend-dev-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    user: "${LARISSAMA_UID:-1000}:${LARISSAMA_GID:-1000}"
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${LARISSAMA_API_PORT:-8010}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${LARISSAMA_APP_KEY:-}
      APP_URL: "http://localhost:${LARISSAMA_API_PORT:-8010}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${LARISSAMA_DB_DATABASE:-larissama_dev}
      DB_USERNAME: ${LARISSAMA_DB_USERNAME:-larissama_local}
      DB_PASSWORD: ${LARISSAMA_DB_PASSWORD:-larissama-local-only}
      DB_URL: ""
      COMPOSER_HOME: /tmp/composer
    command:
      - sh
      - -lc
      - composer install --no-interaction && if [ -z "$$APP_KEY" ]; then export APP_KEY="$$(php artisan key:generate --show)"; fi && php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ${LARISSAMA_DB_DATABASE:-larissama_dev}
      MYSQL_USER: ${LARISSAMA_DB_USERNAME:-larissama_local}
      MYSQL_PASSWORD: ${LARISSAMA_DB_PASSWORD:-larissama-local-only}
      MYSQL_ROOT_PASSWORD: ${LARISSAMA_DB_ROOT_PASSWORD:-larissama-root-local-only}
    ports:
      - "127.0.0.1:${LARISSAMA_DB_PORT:-33309}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
