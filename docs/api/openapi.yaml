      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Active:
      name: aktif
      in: query
      schema:
        type: boolean
      description: Filter boolean; pada endpoint katalog, kasir selalu dibatasi ke kategori/menu aktif walaupun mengirim aktif=false.
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 150
      description: Cari nama; menu juga kode, user juga username, warung juga kode.
    DateFrom:
      name: date_from
      in: query
      schema:
        $ref: '#/components/schemas/Date'
      description: Awal periode lokal inklusif (D08); kirim berpasangan dengan date_to.
    DateTo:
      name: date_to
      in: query
      schema:
        $ref: '#/components/schemas/Date'
      description: Akhir periode lokal inklusif (D08); date_from <= date_to.
  responses:
    Error400:
      description: JSON request tidak dapat dibaca.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BAD_REQUEST
            message: JSON request tidak dapat dibaca.
            errors: {}
            request_id: req-contoh-001
    Error401:
      description: Login diperlukan atau kredensial/token tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: Login diperlukan atau kredensial/token tidak valid.
            errors: {}
            request_id: req-contoh-001
    Error403:
      description: Role tidak diizinkan; user/warung nonaktif atau masa aktif tidak memenuhi D03.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Role tidak diizinkan; user/warung nonaktif atau masa aktif tidak memenuhi D03.
            errors: {}
            request_id: req-contoh-001
    Error404:
      description: Resource tidak ada dalam scope yang boleh diakses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Resource tidak ada dalam scope yang boleh diakses.
            errors: {}
            request_id: req-contoh-001
    Error409:
      description: Konflik keunikan atau state yang sudah disepakati.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: Konflik keunikan atau state yang sudah disepakati.
            errors: {}
            request_id: req-contoh-001
    IdempotencyConflict409:
      description: Idempotency-Key yang sama sudah tercatat untuk payload berbeda.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IDEMPOTENCY_KEY_REUSED
            message: Idempotency-Key sudah digunakan untuk payload berbeda.
            errors: {}
            request_id: req-contoh-001
    Error422:
      description: Field tidak valid, referensi tenant tidak sah, nominal/rentang tanggal salah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Field tidak valid, referensi tenant tidak sah, nominal/rentang tanggal salah.
            errors:
              rincian.0.nama_item:
              - Wajib diisi.
            request_id: req-contoh-001
    Error429:
      description: Terlalu banyak request menurut batas yang ditetapkan D02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Terlalu banyak request menurut batas yang ditetapkan D02.
            errors: {}
            request_id: req-contoh-001
    Error500:
      description: Kesalahan server; response tidak mengungkap detail SQL/rahasia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNAL_ERROR
            message: Kesalahan server; response tidak mengungkap detail SQL/rahasia.
            errors: {}
            request_id: req-contoh-001
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      description: ID BIGINT dikirim sebagai string agar tidak kehilangan presisi di JavaScript.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,12})\.[0-9]{2}$
      description: Decimal string eksak nonnegatif dengan dua angka pecahan sesuai baseline D05; jangan memakai float. Batas saat ini mengikuti DECIMAL(15,2).
    Quantity:
      type: string
      pattern: ^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,7}\.[0-9]{2})$
      description: 'Kandidat D05: > 0 sampai 99999999.99; string dua angka pecahan.'
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 dengan offset; timestamp disimpan/dikirim UTC. Tampilan dan periode mengikuti identifier IANA di warung; zona kosong/invalid menolak akses, backdate menunggu D08.
    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: Identifier timezone IANA seperti Asia/Jakarta; divalidasi server.
    Date:
      type: string
      format: date
    Note:
      type:
      - string
      - 'null'
      description: Catatan bebas, null jika tidak diisi.
    Role:
      type: string
      enum:
      - superadmin
      - owner
      - manager
      - kasir
      - koki
      description: Nilai pada rancangan DB; izin final D04. Koki tidak menyiratkan adanya workflow dapur.
    Warung:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kode:
          type: string
          minLength: 1
          maxLength: 30
        nama:
          type: string
          minLength: 1
          maxLength: 150
        alamat:
          $ref: '#/components/schemas/Note'
        telepon:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 30
          - type: 'null'
        logo:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        timezone:
          anyOf:
          - $ref: '#/components/schemas/Timezone'
          - type: 'null'
        tanggal_mulai:
          anyOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
        tanggal_berakhir:
          anyOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
        aktif:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kode
      - nama
      - alamat
      - telepon
      - logo
      - timezone
      - tanggal_mulai
      - tanggal_berakhir
      - aktif
      - created_at
      - updated_at
    User:
