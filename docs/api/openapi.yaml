      x-contract-status: DRAFT
      x-implementation-status: IN_PROGRESS
      x-candidate-roles: []
      x-blocked-by:
      - D08
      - D12
      - D13
      responses:
        '200':
          description: Kandidat hasil sukses; contoh sintetis, bukan data server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultResponse'
              example:
                data:
                  access_token: contoh-token-bukan-kredensial
                  token_type: Bearer
                  expires_at: '2026-11-03T03:00:00Z'
                  user:
                    id: '11'
                    warung_id: '1'
                    nama: Pemilik A
                    username: owner_a
                    email: null
                    role: owner
                    aktif: true
                    created_at: '2026-10-04T03:00:00Z'
                    updated_at: '2026-10-04T03:00:00Z'
                  warung:
                    id: '1'
                    kode: W-A
                    nama: Warung A
                    alamat: null
                    telepon: null
                    logo: null
                    timezone: Asia/Jakarta
                    tanggal_mulai: '2026-10-01'
                    tanggal_berakhir: '2026-10-31'
                    aktif: true
                    created_at: '2026-10-04T03:00:00Z'
                    updated_at: '2026-10-04T03:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  username: owner_a
                  password: contoh-password
