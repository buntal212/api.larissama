openapi: 3.1.0
info:
  title: LarisSama Backend API — Draft
  version: 0.1.1-draft
  description: >-
    Status handoff 2026-10-06: seluruh 33 operationId berstatus READY_FOR_FRONTEND
    untuk integrasi alur utama, termasuk lima operationId koreksi/pembatalan/retur.
    Pengujian edge-case lanjutan dijadwalkan setelah integrasi frontend dimulai;
    x-deferred-verification per operationId menjelaskan batasnya. x-contract-status
    adalah status handoff terkini. User menyetujui baseline wire D13: /api/v1,
    ID/decimal string, envelope data/meta, page integer >= 1 tanpa batas maksimum dan per_page 1–100, sort
    allowlist, dan error code/message/errors/request_id. Slice transaksi dan auth
    memiliki feature test HTTP pada MySQL 8.0.40 untuk sebagian create/read/report,
    tenant scope, snapshot, retry, atomicity, batas DST, periode kosong/invalid,
    login/me, role context, status akun, expiry/logout, rate limit, provisioning
    admin warung/user tenant, katalog, dan transaksi/laporan memiliki acceptance
    test parsial. Response runtime auth, admin, katalog, dan transaksi/laporan dicocokkan
    dengan schema untuk subset operasi/status; requestBody POST/PATCH admin/katalog,
    body/header POST sale/purchase, dan query terpilih pada list akses/katalog/transaksi
    serta report juga diperiksa terhadap OpenAPI. Pada enam GET list, nilai sort di luar enum diuji ditolak dengan HTTP/schema 422 dan seluruh 14 nilai enum terdokumentasi diuji diterima dengan HTTP/schema 200; tie-breaker `id` diuji searah sort lintas dua halaman per opsi (`ACCESS-SORT-ALLOWLIST-CONFORMANCE-001`, `ACCESS-SORT-VALID-ENUM-CONFORMANCE-001`, `ACCESS-SORT-TIE-BREAKER-CONFORMANCE-001`), dan semua opsi diuji mengurutkan nilai primer berbeda secara naik/turun (`ACCESS-SORT-ORDERING-CONFORMANCE-001`). Metadata hasil kosong dan halaman di luar `last_page` juga diuji sesuai schema pada keenam list (`ACCESS-PAGINATION-EMPTY-PAGE-CONFORMANCE-001`). Default `page=1`, `per_page=20`, dan sort per operasi diverifikasi pada keenam list tanpa query string (`ACCESS-PAGINATION-DEFAULT-CONFORMANCE-001`). Teks angka desimal, pecahan, dan eksponen ditolak untuk parameter integer `page`/`per_page` pada keenam list (`ACCESS-PAGINATION-NUMERIC-TYPE-CONFORMANCE-001`). Nilai `page=9223372036854775808` diterima pada keenam list, setelah last_page menghasilkan data kosong, dan `meta.page` mempertahankan token integer JSON eksak tanpa offset SQL (`UNBOUNDED-PAGINATION-PAGE-CONFORMANCE-001`).
    CURRENT-WARUNG-API-ACCEPTANCE-001 menguji response profil `/warung` untuk manager/kasir,
    superadmin dan anonim; `OWNER-TENANT-ACCESS-CONFORMANCE-001` kini mencocokkan response profil owner tenant dengan schema. Request/query operasi lain,
    D06 menetapkan menu/kategori aktif untuk sale baru, koreksi/pembatalan beralasan sampai 72 jam sejak pencatatan, dan retur nominal penuh/sebagian beralasan setelahnya. Retur mengurangi laporan pada periode retur tanpa mengubah stok. Implementasi 33 operationId tersedia dan seluruhnya siap untuk integrasi alur utama; lima operasi D06/D11 memiliki catatan edge-case tertunda masing-masing.
    PROTECTED-OPERATIONS-401-CONFORMANCE-001 telah menguji tanpa token seluruh 32 operasi yang mewajibkan bearer:
    HTTP 401 UNAUTHENTICATED dan body cocok schema; status lain dan conformance keseluruhan masih belum lengkap.
    API-ROUTE-INVENTORY-CONFORMANCE-001 sebelumnya mencocokkan baseline 28 method/path; inventory kini 33 operation pada 21 path dan telah dicocokkan oleh test route terkini;
    pemeriksaan ini adalah inventory terkini; bukti conformance request/response dan kesiapan integrasi tetap per operationId.
    API-PATH-ID-POSITIVE-CONFORMANCE-001 membuktikan seluruh sepuluh operasi ber-parameter {id} memakai
    pola string positif OpenAPI dan menolak 0, nol di depan, serta teks dengan response 404 schema-conformant.
    REPORT-RBAC-CONFORMANCE-001 menguji kedua report: manager mendapat akses, kasir dan superadmin mendapat 403.
    `OWNER-TENANT-ACCESS-CONFORMANCE-001` menguji akses owner pada kedua laporan dan tenant isolation. API-END-TO-END-WORKFLOW-001 menguji satu alur HTTP
    lintas provisioning, katalog, transaksi, laporan, dan logout pada MySQL 8.0.40; hasilnya parsial; status handoff saat ini mengikuti x-contract-status setiap operationId.
    TRANSACTION-LIST-QUERY-REJECTION-001 memeriksa Error422 untuk enum status sale dan tanggal list invalid.
    TRANSACTION-LIST-QUERY-PAIR-REQUIRED-001 membuktikan date_from/date_to harus dikirim bersama; satu parameter saja menghasilkan Error422.
    API-END-TO-END-READBACK-001 menguji manager membaca list/detail transaksi yang dibuat pada workflow API dan mencocokkan response terpilih.
    SUPERADMIN-TRANSACTION-RBAC-CONFORMANCE-001 mencocokkan request/response OpenAPI untuk create sale dan purchase;
    superadmin tanpa warung mendapat 403 dan tidak menulis header/rincian. Matriks role lain tetap parsial.
    ROLE-TRANSACTION-CREATE-RBAC-CONFORMANCE-001 menguji payload valid: manager ditolak saat create sale dan kasir
    ditolak saat create purchase, tanpa write header/rincian. Owner diizinkan membuat keduanya; `OWNER-TENANT-ACCESS-CONFORMANCE-001` menguji create sale/purchase dan response terhadap schema.
    Sanctum bearer 30 hari, timezone tenant,
    baseline decimal, Idempotency-Key, dan FK gabungan telah dipilih; rincian
    D05, D08, D10, dan aturan identitas D12 (termasuk minimum password 8 karakter
    saat membuat atau mengganti password) telah diputuskan. Database produksi dikonfirmasi kosong; guard
    tetap menolak database non-kosong tanpa pemetaan. Sisa gate mencakup role/runtime conformance D04/D13,
    conformance penuh D04/D13, serta deployment dan handoff.
    Lihat docs/backend/DECISIONS.md dan IMPLEMENTATION_PROGRESS.md. Contoh
    sintetis; nomor contoh memakai format sementara PJ-/PB-ULID dan bukan
    kontrak live.
servers:
- url: /api/v1
  description: Prefix /api/v1 yang disetujui D13; base URL environment belum ditetapkan.
