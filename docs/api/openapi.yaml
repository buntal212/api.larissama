      type: string
      pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
      description: Jumlah nominal lintas transaksi. String decimal eksak; tidak dibatasi kapasitas satu kolom DECIMAL(15,2).
        Backend memakai agregasi dengan presisi yang cukup, tanpa float.
    SignedAggregateMoney:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{2}$
      description: Pendapatan bersih setelah mengurangi retur periode; dapat negatif bila retur periode melebihi penjualan periode. String decimal eksak tanpa float.
