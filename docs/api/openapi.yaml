      - Laporan
      summary: Total pembelian pada periode
      description: >-
        Menjumlah total dan menghitung header pembelian berstatus tercatat di periode timezone warung;
        pembelian dibatalkan tidak masuk hitungan. Tidak join rincian atau mengurangi dari pendapatan sebagai laba. READY_FOR_FRONTEND untuk alur laporan inti; edge-case lanjutan tercatat untuk susulan.
        TRANSACTION-CONFORMANCE-001 mencocokkan response 200/422. TRANSACTION-QUERY-CONFORMANCE-001
        mencocokkan date_from/date_to wajib dan format Date pada query sukses terpilih; nilai/status lain
        dan gate penuh masih terbuka. REPORT-RBAC-CONFORMANCE-001 mencocokkan response 403 untuk kasir dan
        superadmin; D04 kini mengizinkan owner serta manager; `OWNER-TENANT-ACCESS-CONFORMANCE-001` menguji akses owner ke kedua report dan mencocokkan response dengan schema.
      x-contract-status: READY_FOR_FRONTEND
      x-deferred-verification: "Extended error/status and edge-case conformance will be completed after frontend integration begins; see docs/api/README.md."
      x-implementation-status: DONE
      x-candidate-roles:
      - owner
      - manager
      x-blocked-by:
      - D02
      - D13
      responses:
        '200':
          description: Kandidat hasil sukses; contoh sintetis, bukan data server.
          content:
            application/json:
              schema:
