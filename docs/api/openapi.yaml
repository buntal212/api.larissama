              example:
                data:
                  period:
                    date_from: '2026-10-01'
                    date_to: '2026-10-31'
                    timezone: Asia/Jakarta
                  jumlah_transaksi: 2
                  total_pembelian: '245000.00'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - name: date_from
        in: query
        schema:
          $ref: '#/components/schemas/Date'
        description: Awal hari lokal inklusif (D08); kirim bersama date_to. Respons 422 pada date_from bila batas awal UTC berada di luar rentang MySQL DATETIME tahun 1000–9999.
        required: true
      - name: date_to
        in: query
        schema:
          $ref: '#/components/schemas/Date'
        description: Tanggal akhir lokal inklusif (D08); date_from <= date_to. Respons 422 pada date_to bila batas akhir-eksklusif UTC berada di luar rentang MySQL DATETIME tahun 1000–9999.
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Mekanisme terpilih: Sanctum bearer token; `laravel/sanctum` v4.3.3 dan migration token sudah terpasang.
        Token kedaluwarsa setelah 30 hari; logout mencabut token aktif. Login dibatasi 5 percobaan per menit per kombinasi username+IP.
        Route auth sudah dibuat tetapi belum lulus verifikasi aplikasi/kontrak. Personal access token opaque; CORS, HTTPS, dan detail deployment masih D02.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: ID resource; lookup selalu mengikuti scope operasi.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^\S(?:.*\S)?$'
      description: Key unik per warung, user, dan jenis operasi selama 7 hari sejak request pertama. Retry identik me-replay respons awal; payload berbeda menghasilkan 409. Setelah expiry key dapat dipakai sebagai request baru.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Halaman bilangan bulat positif tanpa batas maksimum. Halaman setelah last_page mengembalikan data kosong dan mempertahankan total hasil filter. Nilai di atas rentang integer PHP tetap diterima dan dikirim sebagai token integer JSON eksak; bukti keenam GET list ada pada UNBOUNDED-PAGINATION-PAGE-CONFORMANCE-001.
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Active:
      name: aktif
      in: query
      schema:
        type: boolean
      description: Filter boolean; pada endpoint katalog, kasir selalu dibatasi ke kategori/menu aktif walaupun mengirim aktif=false.
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 150
      description: Cari nama; menu juga kode, user juga username, warung juga kode.
    DateFrom:
      name: date_from
      in: query
      schema:
        $ref: '#/components/schemas/Date'
      description: Awal hari lokal inklusif (D08); kirim bersama date_to. Respons 422 pada date_from bila batas awal UTC berada di luar rentang MySQL DATETIME tahun 1000–9999.
      example: '2026-10-04'
    DateTo:
      name: date_to
      in: query
      schema:
        $ref: '#/components/schemas/Date'
      description: Tanggal akhir lokal inklusif (D08); date_from <= date_to. Respons 422 pada date_to bila batas akhir-eksklusif UTC berada di luar rentang MySQL DATETIME tahun 1000–9999.
      example: '2026-10-04'
  responses:
    Error400:
      description: JSON request tidak dapat dibaca.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BAD_REQUEST
            message: JSON request tidak dapat dibaca.
            errors: {}
            request_id: req-contoh-001
    Error401:
      description: Login diperlukan atau kredensial/token tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: Login diperlukan atau kredensial/token tidak valid.
            errors: {}
            request_id: req-contoh-001
    Error403:
      description: Role tidak diizinkan; user/warung nonaktif atau masa aktif tidak memenuhi D03.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Role tidak diizinkan; user/warung nonaktif atau masa aktif tidak memenuhi D03.
            errors: {}
            request_id: req-contoh-001
    Error404:
      description: Resource tidak ada dalam scope yang boleh diakses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Resource tidak ada dalam scope yang boleh diakses.
            errors: {}
            request_id: req-contoh-001
    Error409:
      description: Konflik keunikan atau state yang sudah disepakati.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: Konflik keunikan atau state yang sudah disepakati.
            errors: {}
            request_id: req-contoh-001
    IdempotencyConflict409:
      description: Idempotency-Key yang sama sudah tercatat untuk payload berbeda.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IDEMPOTENCY_KEY_REUSED
            message: Idempotency-Key sudah digunakan untuk payload berbeda.
            errors: {}
            request_id: req-contoh-001
    Error422:
      description: Field tidak valid, referensi tenant tidak sah, nominal/rentang tanggal salah.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Field tidak valid, referensi tenant tidak sah, nominal/rentang tanggal salah.
            errors:
              rincian.0.nama_item:
              - Wajib diisi.
            request_id: req-contoh-001
    Error429:
      description: Terlalu banyak request menurut batas yang ditetapkan D02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Terlalu banyak request menurut batas yang ditetapkan D02.
            errors: {}
            request_id: req-contoh-001
    Error500:
      description: Kesalahan server; response tidak mengungkap detail SQL/rahasia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNAL_ERROR
            message: Kesalahan server; response tidak mengungkap detail SQL/rahasia.
            errors: {}
            request_id: req-contoh-001
  schemas:
    Id:
      type: string
      pattern: ^[1-9][0-9]*$
      description: ID BIGINT dikirim sebagai string agar tidak kehilangan presisi di JavaScript.
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,12})\.[0-9]{2}$
      description: Decimal string eksak nonnegatif dengan dua angka pecahan sesuai baseline D05; jangan memakai float. Batas saat ini mengikuti DECIMAL(15,2).
    MenuPrice:
      type: string
      pattern: ^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,12}\.[0-9]{2})$
      description: Harga jual menu harus positif, dikirim sebagai decimal string dengan dua angka pecahan sesuai D05; batas mengikuti DECIMAL(15,2).
    Quantity:
      type: string
      pattern: ^(0\.(0[1-9]|[1-9][0-9])|[1-9][0-9]{0,7}\.[0-9]{2})$
      description: Nilai > 0 sampai 99999999.99; string dua angka pecahan sesuai keputusan D05.
    Timestamp:
      type: string
      format: date-time
      pattern: '^[1-9]\d{3}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$'
      description: 'Profil RFC3339: tahun 1000–9999, jam 00–23, menit/detik 00–59, zona Z atau offset ±HH:MM. Pada create transaksi, offset diubah ke UTC dan instant harus berada dalam rentang MySQL DATETIME (1000-01-01T00:00:00Z sampai 9999-12-31T23:59:59Z); instant di luar rentang ditolak. Future transaction instant ditolak; backdate diterima. Pecahan detik pada request create transaksi diterima tetapi dipotong ke presisi detik DATETIME, tanpa pembulatan. Leap second tidak didukung. Timestamp disimpan/dikirim UTC; tampilan/periode memakai zona IANA warung. Zona kosong/invalid menolak akses.'
    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: Identifier timezone IANA seperti Asia/Jakarta; divalidasi server.
    Date:
      type: string
      format: date
    Note:
      type:
      - string
      - 'null'
      description: Catatan bebas, null jika tidak diisi.
    Role:
      type: string
      enum:
      - superadmin
      - owner
      - manager
      - kasir
      - koki
