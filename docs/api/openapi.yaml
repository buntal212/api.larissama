  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Login user
      description: 'READY_FOR_FRONTEND (core path): AUTH-API-ACCEPTANCE-001 menguji login, error, expiry, limiter, dan field set D13; AUTH-CONFORMANCE-001 mencocokkan response runtime untuk status 200/401/403/422/429; AUTH-REQUEST-CONFORMANCE-001 mencocokkan body valid terpilih untuk sukses/401 dengan LoginRequest. Request/status lain dan conformance lengkap belum diverifikasi. Maksimum 5 percobaan login per menit untuk username lowercase dan IP; uppercase ditolak dan tidak dinormalisasi.'
      x-contract-status: READY_FOR_FRONTEND
      x-deferred-verification: "Extended error/status and edge-case conformance will be completed after frontend integration begins; see docs/api/README.md."
      x-implementation-status: DONE
      x-candidate-roles: []
      x-blocked-by:
      - D13
      responses:
        '200':
          description: Kandidat hasil sukses; contoh sintetis, bukan data server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultResponse'
              example:
                data:
                  access_token: contoh-token-bukan-kredensial
                  token_type: Bearer
                  expires_at: '2026-11-03T03:00:00Z'
                  user:
                    id: '11'
                    warung_id: '1'
                    nama: Pemilik A
                    username: owner_a
                    email: null
                    role: owner
                    aktif: true
                    created_at: '2026-10-04T03:00:00Z'
                    updated_at: '2026-10-04T03:00:00Z'
                  warung:
                    id: '1'
                    kode: W-A
                    nama: Warung A
                    alamat: null
                    telepon: null
                    logo: null
                    timezone: Asia/Jakarta
                    tanggal_mulai: '2026-10-01'
                    tanggal_berakhir: '2026-10-31'
                    aktif: true
                    created_at: '2026-10-04T03:00:00Z'
                    updated_at: '2026-10-04T03:00:00Z'
        '400':
