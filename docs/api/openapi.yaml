      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Resource tidak ada dalam scope yang boleh diakses.
            errors: {}
            request_id: req-contoh-001
    Error409:
